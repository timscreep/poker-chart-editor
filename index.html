<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Hand Chart Editor Pro</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

        <style>
            :root {
                --surface0: #1e1e2e;
                --surface1: #313244;
                --surface2: #45475a;
                --text: #cdd6f4;
                --mauve: #cba6f7;
            }

            body {
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                background: var(--surface0);
                color: var(--text);
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                min-height: 100vh;
            }

            .controls-container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                background: var(--surface1);
                padding: 24px;
                border-radius: 24px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            .palette, .actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
            }

            /* Заменили .color-dot на более удобные кнопки-действия */
            .action-btn {
                padding: 10px 20px;
                border-radius: 12px;
                cursor: pointer;
                border: 2px solid transparent;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                font-weight: 700;
                font-size: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #11111b;
                user-select: none;
            }

            .action-btn.selected {
                border-color: #fff;
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            }

            .action-btn.eraser {
                background: var(--surface2);
                color: var(--text);
            }

            .matrix-scroll-area {
                width: 100%;
                overflow-x: auto;
                padding: 10px 0 30px 0;
                display: flex;
                justify-content: center;
                scrollbar-width: none;
            }
            .matrix-scroll-area::-webkit-scrollbar { display: none; }

            .matrix {
                display: grid;
                grid-template-columns: repeat(13, 1fr);
                gap: 4px;
                background: var(--surface1);
                padding: 12px;
                border-radius: 20px;
                width: 780px;
                min-width: 780px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }

            .cell {
                height: 54px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--surface2);
                cursor: pointer;
                user-select: none;
                font-size: 13px;
                font-weight: 700;
                border-radius: 8px;
                transition: transform 0.1s ease, filter 0.1s ease;
            }

            .cell:hover {
                filter: brightness(1.2);
                z-index: 10;
            }

            .btn {
                padding: 12px 24px;
                border-radius: 14px;
                background: var(--mauve);
                color: #11111b;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                border: none;
                transition: all 0.2s ease;
                box-shadow: 0 4px 12px rgba(203, 166, 247, 0.2);
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(203, 166, 247, 0.4);
            }

            .btn:active { transform: translateY(0); }

            .btn.secondary {
                background: var(--surface2);
                color: var(--text);
                box-shadow: none;
            }
            
            .btn.secondary:hover { background: #585b70; }
            input[type="file"] { display: none; }

            .minimap {
                display: none;
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 140px;
                height: 36px;
                background: rgba(49, 50, 68, 0.9);
                border-radius: 18px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                z-index: 100;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                touch-action: none;
            }
            .minimap-viewport {
                position: absolute;
                top: 2px;
                left: 2px;
                height: 30px;
                background: rgba(203, 166, 247, 0.4);
                border: 2px solid var(--mauve);
                border-radius: 14px;
                cursor: grab;
            }

            @media (max-width: 640px) {
                .cell { height: 46px; font-size: 11px; border-radius: 6px; }
                .matrix { width: 600px; min-width: 600px; padding: 8px; border-radius: 16px; }
                .controls-container { padding: 16px; border-radius: 20px; }
                .minimap { display: block; }
            }
        </style>
    </head>

    <body>
        <div class="controls-container">
            <div class="palette">
                <!-- Контейнер для кнопок действий -->
                <div id="actionButtons" class="flex gap-3 flex-wrap justify-center"></div>
                <div class="action-btn eraser" data-action="Erase" title="Ластик">Ластик ✕</div>
            </div>

            <div class="actions">
                <button id="clearAll" class="btn secondary">Очистить</button>
                <button id="loadBtn" class="btn secondary">Загрузить JSON</button>
                <button id="saveBtn" class="btn">Сохранить JSON</button>
                <button id="savePng" class="btn">Скачать PNG</button>
                <input id="fileIn" type="file" accept="application/json" />
            </div>
        </div>

        <div class="matrix-scroll-area">
            <div id="matrix" class="matrix"></div>
        </div>

        <div id="minimap" class="minimap">
            <div id="minimap-viewport" class="minimap-viewport"></div>
        </div>

        <script>
            // Определяем игровые действия и цвета в стиле Catppuccin Macchiato
            const POKER_ACTIONS = [
                { id: "Raise", color: "#f38ba8" }, // Красный
                { id: "Call", color: "#a6e3a1" },  // Зеленый
                { id: "Fold", color: "#89b4fa" }   // Синий
            ];

            const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
            const matrixBox = document.getElementById("matrix");
            const actionBox = document.getElementById("actionButtons");
            
            let currentAction = POKER_ACTIONS[0];
            let eraseMode = false;

            // Генерация кнопок действий
            POKER_ACTIONS.forEach(action => {
                const btn = document.createElement("div");
                btn.className = "action-btn";
                btn.dataset.action = action.id;
                btn.style.background = action.color;
                btn.textContent = action.id;
                btn.onclick = () => selectAction(btn, action);
                actionBox.appendChild(btn);
            });

            const eraserBtn = document.querySelector('.eraser');
            eraserBtn.onclick = () => selectAction(eraserBtn, null);

            function selectAction(btn, actionObj) {
                document.querySelectorAll(".action-btn").forEach(d => d.classList.remove("selected"));
                btn.classList.add("selected");
                
                if (actionObj === null) {
                    eraseMode = true;
                    currentAction = null;
                } else {
                    eraseMode = false;
                    currentAction = actionObj;
                }
            }
            // Выбираем первое действие по умолчанию (Raise)
            selectAction(actionBox.firstChild, POKER_ACTIONS[0]);

            // Генерация матрицы рук
            ranks.forEach((r1, i) => {
                ranks.forEach((r2, j) => {
                    const hand = i === j ? r1 + r2 : (i < j ? r1 + r2 + "s" : r2 + r1 + "o");
                    const c = document.createElement("div");
                    c.className = "cell";
                    c.dataset.hand = hand;
                    c.textContent = hand;
                    matrixBox.appendChild(c);
                });
            });

            // Функция покраски с привязкой действия
            function paint(el, forceErase = false) {
                if (!el || !el.classList.contains("cell")) return;
                
                if (eraseMode || forceErase) {
                    el.style.background = "";
                    el.style.color = "";
                    el.removeAttribute("data-action");
                    el.removeAttribute("data-color");
                } else {
                    el.style.background = currentAction.color;
                    el.dataset.action = currentAction.id;
                    el.dataset.color = currentAction.color;
                    
                    // Вычисляем яркость для контрастного текста
                    const hex = currentAction.color.replace('#','');
                    const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                    const brightness = (r*299 + g*587 + b*114) / 1000;
                    el.style.color = brightness > 160 ? "#11111b" : "#fff";
                }
            }

            // Обработчики мыши и тапов (остались прежними)
            matrixBox.oncontextmenu = (e) => e.preventDefault();
            matrixBox.onmousedown = (e) => {
                if (e.button === 0) paint(e.target, false);
                if (e.button === 2) paint(e.target, true);
            };
            matrixBox.onmouseover = (e) => {
                if (e.buttons === 1) paint(e.target, false);
                if (e.buttons === 2) paint(e.target, true);
            };

            matrixBox.ontouchstart = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                paint(el, false);
            };
            matrixBox.ontouchmove = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                paint(el, false);
            };

            // --- Логика мини-карты (осталась без изменений) ---
            const minimap = document.getElementById('minimap');
            const mapViewport = document.getElementById('minimap-viewport');
            const scrollArea = document.querySelector('.matrix-scroll-area');

            function syncMinimap() {
                const mapWidth = minimap.clientWidth - 4;
                const scrollWidth = scrollArea.scrollWidth;
                const clientWidth = scrollArea.clientWidth;

                const viewportWidth = Math.max(20, (clientWidth / scrollWidth) * mapWidth);
                mapViewport.style.width = `${viewportWidth}px`;

                const maxScrollLeft = scrollWidth - clientWidth;
                if (maxScrollLeft > 0) {
                    const scrollLeft = scrollArea.scrollLeft;
                    const leftPos = (scrollLeft / maxScrollLeft) * (mapWidth - viewportWidth);
                    mapViewport.style.left = `${leftPos + 2}px`;
                }
            }
            
            scrollArea.addEventListener('scroll', syncMinimap);
            window.addEventListener('resize', syncMinimap);
            setTimeout(syncMinimap, 100);

            let mapDragging = false;
            let startMapX = 0;
            let startScroll = 0;

            minimap.addEventListener('touchstart', (e) => {
                mapDragging = true;
                startMapX = e.touches[0].clientX;
                startScroll = scrollArea.scrollLeft;
                e.preventDefault();
            }, {passive: false});

            window.addEventListener('touchmove', (e) => {
                if (!mapDragging) return;
                const dx = e.touches[0].clientX - startMapX;
                const mapWidth = minimap.clientWidth - 4;
                const scrollWidth = scrollArea.scrollWidth;
                const clientWidth = scrollArea.clientWidth;
                
                const viewportWidth = (clientWidth / scrollWidth) * mapWidth;
                const maxScrollLeft = scrollWidth - clientWidth;
                const maxMapMove = mapWidth - viewportWidth;

                const ratio = maxScrollLeft / maxMapMove;
                scrollArea.scrollLeft = startScroll + (dx * ratio);
            }, {passive: false});

            window.addEventListener('touchend', () => mapDragging = false);


            // --- Сохранение, Загрузка, Очистка ---
            document.getElementById("clearAll").onclick = () => {
                if(confirm("Очистить таблицу?")) {
                    document.querySelectorAll(".cell").forEach(c => paint(c, true));
                }
            };

            // Экспорт JSON: теперь сохраняем действие (Raise/Call/Fold)
            document.getElementById("saveBtn").onclick = () => {
                let name = prompt("Имя файла JSON:", "poker-actions") || "poker-actions";
                const out = {};
                document.querySelectorAll(".cell").forEach(c => {
                    if (c.dataset.action) {
                        out[c.dataset.hand] = c.dataset.action;
                    }
                });
                const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name + ".json";
                a.click();
            };

            // Импорт JSON
            document.getElementById("loadBtn").onclick = () => document.getElementById("fileIn").click();
            document.getElementById("fileIn").onchange = (e) => {
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = JSON.parse(r.result);
                        document.querySelectorAll(".cell").forEach(c => {
                            const val = data[c.dataset.hand];
                            if (val) {
                                // Ищем, это новое действие (Raise) или старый цвет (#a6e3a1)?
                                const actionMatch = POKER_ACTIONS.find(a => a.id === val || a.color === val);
                                
                                if (actionMatch) {
                                    c.style.background = actionMatch.color;
                                    c.dataset.action = actionMatch.id;
                                    c.dataset.color = actionMatch.color;
                                    
                                    const hex = actionMatch.color.replace('#','');
                                    const rCode = parseInt(hex.substr(0,2),16), gCode = parseInt(hex.substr(2,2),16), bCode = parseInt(hex.substr(4,2),16);
                                    const brightness = (rCode*299 + gCode*587 + bCode*114) / 1000;
                                    c.style.color = brightness > 160 ? "#11111b" : "#fff";
                                }
                            } else {
                                // Если в JSON нет данных для этой руки — стираем
                                paint(c, true);
                            }
                        });
                    } catch(e) { alert("Ошибка загрузки файла"); }
                    e.target.value = ''; // Сброс инпута
                };
                if(e.target.files.length) r.readAsText(e.target.files[0]);
            };

            // Экспорт PNG (без изменений)
            document.getElementById("savePng").onclick = async () => {
                let name = prompt("Имя файла PNG:", "poker-strategy") || "poker-strategy";
                const btn = document.getElementById("savePng");
                const originalText = btn.textContent;
                btn.textContent = "Создание...";
                
                await new Promise(r => setTimeout(r, 100));

                const wrapper = document.createElement("div");
                wrapper.style.padding = "40px";
                wrapper.style.background = "var(--surface0)";
                wrapper.style.display = "inline-flex";
                wrapper.style.justifyContent = "center";
                wrapper.style.alignItems = "center";
                
                const parent = matrixBox.parentNode;
                parent.insertBefore(wrapper, matrixBox);
                wrapper.appendChild(matrixBox);

                try {
                    const scale = 2;
                    const style = {
                        transform: 'scale(' + scale + ')',
                        transformOrigin: 'top left',
                        width: wrapper.offsetWidth + 'px',
                        height: wrapper.offsetHeight + 'px'
                    };

                    const dataUrl = await domtoimage.toPng(wrapper, {
                        width: wrapper.offsetWidth * scale,
                        height: wrapper.offsetHeight * scale,
                        style: style,
                        bgcolor: '#1e1e2e'
                    });

                    const a = document.createElement("a");
                    a.download = name + ".png";
                    a.href = dataUrl;
                    a.click();
                } catch (e) {
                    console.error("Ошибка экспорта:", e);
                    alert("Ошибка экспорта PNG");
                } finally {
                    parent.insertBefore(matrixBox, wrapper);
                    wrapper.remove();
                    btn.textContent = originalText;
                }
            };
        </script>
    </body>
</html>
