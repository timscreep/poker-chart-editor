<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Hand Chart Editor Pro</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

        <style>
            :root {
                --surface0: #313244;
                --surface1: #45475a;
                --surface2: #585b70;
                --text: #cdd6f4;
                --base: #1e1e2e;
                --mauve: #cba6f7;
            }

            body {
                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: var(--base);
                color: var(--text);
                margin: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
                min-height: 100vh;
            }

            /* Адаптивная панель инструментов */
            .controls-container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                background: var(--surface0);
                padding: 15px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            }

            .palette, .actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
            }

            .color-dot {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                cursor: pointer;
                border: 2px solid transparent;
                transition: all 0.1s ease;
            }

            .color-dot.selected {
                border-color: #fff;
                transform: scale(1.1);
                box-shadow: 0 0 10px var(--mauve);
            }

            /* Матрица и скролл */
            .matrix-scroll-area {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 10px;
                display: flex;
                justify-content: center;
            }

            .matrix {
                display: grid;
                grid-template-columns: repeat(13, 1fr);
                gap: 2px;
                background: #11111b; /* Более темный фон для контраста границ */
                padding: 4px;
                border-radius: 4px;
                /* Фиксированная ширина для стабильности экспорта */
                width: 780px; 
                min-width: 780px;
            }

            .cell {
                height: 54px; /* Фиксированная высота вместо aspect-ratio для html2canvas */
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--surface1);
                cursor: pointer;
                user-select: none;
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
            }

            .btn {
                padding: 8px 16px;
                border-radius: 6px;
                background: var(--mauve);
                color: #1e1e2e;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                border: none;
                transition: opacity 0.2s;
            }

            .btn:active { opacity: 0.7; }
            .btn.secondary { background: var(--surface2); color: var(--text); }

            input[type="file"] { display: none; }

            /* Мобильные правки */
            @media (max-width: 640px) {
                .cell { height: 45px; font-size: 11px; }
                .matrix { width: 600px; min-width: 600px; }
            }
        </style>
    </head>

    <body>
        <div class="controls-container">
            <div class="palette">
                <div id="paletteColors" class="flex gap-2 flex-wrap justify-center"></div>
                <div class="color-dot flex items-center justify-center bg-slate-700 text-white" 
                     data-color="erase" title="Ластик">✕</div>
            </div>

            <div class="actions">
                <button id="clearAll" class="btn secondary">Очистить</button>
                <button id="loadBtn" class="btn secondary">Загрузить JSON</button>
                <button id="saveBtn" class="btn">JSON</button>
                <button id="savePng" class="btn">Сохранить PNG</button>
                <input id="fileIn" type="file" accept="application/json" />
            </div>
        </div>

        <div class="matrix-scroll-area">
            <div id="matrix" class="matrix"></div>
        </div>

        <script>
            const PALETTE_COLORS = [
                "#a6e3a1", "#94e2d5", "#89dceb", "#74c7ec", "#89b4fa",
                "#b4befe", "#cba6f7", "#f5c2e7", "#eba0ac", "#f38ba8",
                "#fab387", "#f9e2af", "#ffffff"
            ];

            const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
            const matrixBox = document.getElementById("matrix");
            const paletteBox = document.getElementById("paletteColors");
            
            let currentColor = PALETTE_COLORS[0];
            let eraseMode = false;
            let painting = false;

            // Рендер палитры
            PALETTE_COLORS.forEach(color => {
                const d = document.createElement("div");
                d.className = "color-dot";
                d.dataset.color = color;
                d.style.background = color;
                d.onclick = () => selectColor(d);
                paletteBox.appendChild(d);
            });

            const eraser = document.querySelector('[data-color="erase"]');
            eraser.onclick = () => selectColor(eraser);

            function selectColor(dot) {
                document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("selected"));
                dot.classList.add("selected");
                eraseMode = dot.dataset.color === "erase";
                currentColor = eraseMode ? null : dot.dataset.color;
            }
            selectColor(paletteBox.firstChild);

            // Рендер матрицы
            ranks.forEach((r1, i) => {
                ranks.forEach((r2, j) => {
                    const hand = i === j ? r1 + r2 : (i < j ? r1 + r2 + "s" : r2 + r1 + "o");
                    const c = document.createElement("div");
                    c.className = "cell";
                    c.dataset.hand = hand;
                    c.textContent = hand;
                    matrixBox.appendChild(c);
                });
            });

            function paint(el) {
                if (!el.classList.contains("cell")) return;
                if (eraseMode) {
                    el.style.background = "";
                    el.style.color = "";
                    el.removeAttribute("data-color");
                } else {
                    el.style.background = currentColor;
                    // Определяем яркость для цвета текста
                    const hex = currentColor.replace('#','');
                    const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                    const brightness = (r*299 + g*587 + b*114) / 1000;
                    el.style.color = brightness > 155 ? "#000" : "#fff";
                    el.dataset.color = currentColor;
                }
            }

            // События мыши
            matrixBox.onmousedown = (e) => { painting = true; paint(e.target); };
            matrixBox.onmouseover = (e) => { if(painting) paint(e.target); };
            window.onmouseup = () => painting = false;
            matrixBox.oncontextmenu = (e) => e.preventDefault();

            // Тач-события для мобилок
            matrixBox.ontouchmove = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                if (el) paint(el);
            };

            /* === ФУНКЦИИ КНОПОК === */

            document.getElementById("clearAll").onclick = () => {
                if(confirm("Очистить таблицу?")) {
                    document.querySelectorAll(".cell").forEach(c => {
                        c.style.background = ""; c.style.color = ""; c.removeAttribute("data-color");
                    });
                }
            };

            document.getElementById("saveBtn").onclick = () => {
                let name = prompt("Имя файла JSON:", "chart") || "chart";
                const out = {};
                document.querySelectorAll(".cell").forEach(c => {
                    if (c.dataset.color) out[c.dataset.hand] = c.dataset.color;
                });
                const blob = new Blob([JSON.stringify(out)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name + ".json";
                a.click();
            };

            document.getElementById("loadBtn").onclick = () => document.getElementById("fileIn").click();
            document.getElementById("fileIn").onchange = (e) => {
                const r = new FileReader();
                r.onload = () => {
                    const data = JSON.parse(r.result);
                    document.querySelectorAll(".cell").forEach(c => {
                        const col = data[c.dataset.hand];
                        if (col) {
                            c.style.background = col;
                            c.dataset.color = col;
                            c.style.color = "#000"; // упрощено
                        }
                    });
                };
                r.readAsText(e.target.files[0]);
            };

            // Исправленный экспорт PNG
            document.getElementById("savePng").onclick = async () => {
                let name = prompt("Имя файла PNG:", "poker-strategy") || "poker-strategy";
                const btn = document.getElementById("savePng");
                btn.textContent = "Создание...";

                // Небольшая задержка, чтобы UI обновился
                await new Promise(r => setTimeout(r, 100));

                try {
                    const canvas = await html2canvas(matrixBox, {
                        scale: 2, // Высокое качество
                        backgroundColor: "#11111b",
                        logging: false,
                        useCORS: true
                    });
                    const a = document.createElement("a");
                    a.download = name + ".png";
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                } catch (e) {
                    alert("Ошибка при создании PNG");
                } finally {
                    btn.textContent = "Сохранить PNG";
                }
            };
        </script>
    </body>
</html>
