<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Hand Chart Editor Pro</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

        <style>
            :root {
                --surface0: #1e1e2e; /* Base */
                --surface1: #313244; /* Mantle */
                --surface2: #45475a; /* Surface */
                --text: #cdd6f4;
                --mauve: #cba6f7;
                --subtext: #a6adc8;
            }

            body {
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                background: var(--surface0);
                color: var(--text);
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                min-height: 100vh;
            }

            /* Контейнер управления со скруглениями */
            .controls-container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                background: var(--surface1);
                padding: 24px;
                border-radius: 24px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            .palette, .actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
            }

            /* Скругленные индикаторы цвета */
            .color-dot {
                width: 36px;
                height: 36px;
                border-radius: 12px;
                cursor: pointer;
                border: 2px solid transparent;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .color-dot.selected {
                border-color: #fff;
                transform: translateY(-3px) scale(1.1);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            }

            /* Стили матрицы */
            .matrix-scroll-area {
                width: 100%;
                overflow-x: auto;
                padding: 10px 0 30px 0;
                display: flex;
                justify-content: center;
                scrollbar-width: none; /* Прячем нативный скролл */
            }
            .matrix-scroll-area::-webkit-scrollbar { display: none; }

            .matrix {
                display: grid;
                grid-template-columns: repeat(13, 1fr);
                gap: 4px;
                background: var(--surface1);
                padding: 12px;
                border-radius: 20px;
                width: 780px;
                min-width: 780px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }

            .cell {
                height: 54px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--surface2);
                cursor: pointer;
                user-select: none;
                font-size: 13px;
                font-weight: 700;
                border-radius: 8px;
                transition: transform 0.1s ease, filter 0.1s ease;
            }

            .cell:hover {
                filter: brightness(1.2);
                z-index: 10;
            }

            /* Кнопки */
            .btn {
                padding: 12px 24px;
                border-radius: 14px;
                background: var(--mauve);
                color: #11111b;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                border: none;
                transition: all 0.2s ease;
                box-shadow: 0 4px 12px rgba(203, 166, 247, 0.2);
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(203, 166, 247, 0.4);
            }

            .btn:active { transform: translateY(0); }

            .btn.secondary {
                background: var(--surface2);
                color: var(--text);
                box-shadow: none;
            }
            
            .btn.secondary:hover { background: #585b70; }
            input[type="file"] { display: none; }

            /* Мобильная навигация (Мини-карта) */
            .minimap {
                display: none; /* По умолчанию скрыто на ПК */
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 140px;
                height: 36px;
                background: rgba(49, 50, 68, 0.9);
                border-radius: 18px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                z-index: 100;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                touch-action: none;
            }
            .minimap-viewport {
                position: absolute;
                top: 2px;
                left: 2px;
                height: 30px;
                background: rgba(203, 166, 247, 0.4);
                border: 2px solid var(--mauve);
                border-radius: 14px;
                cursor: grab;
            }

            /* Адаптация под мобилки */
            @media (max-width: 640px) {
                .cell { height: 46px; font-size: 11px; border-radius: 6px; }
                .matrix { width: 600px; min-width: 600px; padding: 8px; border-radius: 16px; }
                .controls-container { padding: 16px; border-radius: 20px; }
                .minimap { display: block; } /* Показываем только на телефонах */
            }
        </style>
    </head>

    <body>
        <div class="controls-container">
            <div class="palette">
                <div id="paletteColors" class="flex gap-2 flex-wrap justify-center"></div>
                <div class="color-dot flex items-center justify-center bg-gray-600 text-white text-lg" 
                     data-color="erase" title="Ластик">✕</div>
            </div>

            <div class="actions">
                <button id="clearAll" class="btn secondary">Очистить</button>
                <button id="loadBtn" class="btn secondary">Загрузить JSON</button>
                <button id="saveBtn" class="btn">Сохранить JSON</button>
                <button id="savePng" class="btn">Скачать PNG</button>
                <input id="fileIn" type="file" accept="application/json" />
            </div>
        </div>

        <div class="matrix-scroll-area">
            <div id="matrix" class="matrix"></div>
        </div>

        <div id="minimap" class="minimap">
            <div id="minimap-viewport" class="minimap-viewport"></div>
        </div>

        <script>
            const PALETTE_COLORS = [
                "#a6e3a1", "#94e2d5", "#89dceb", "#74c7ec", "#89b4fa",
                "#b4befe", "#cba6f7", "#f5c2e7", "#eba0ac", "#f38ba8",
                "#fab387", "#f9e2af", "#ffffff"
            ];

            const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
            const matrixBox = document.getElementById("matrix");
            const paletteBox = document.getElementById("paletteColors");
            
            let currentColor = PALETTE_COLORS[0];
            let eraseMode = false;

            PALETTE_COLORS.forEach(color => {
                const d = document.createElement("div");
                d.className = "color-dot";
                d.dataset.color = color;
                d.style.background = color;
                d.onclick = () => selectColor(d);
                paletteBox.appendChild(d);
            });

            const eraser = document.querySelector('[data-color="erase"]');
            eraser.onclick = () => selectColor(eraser);

            function selectColor(dot) {
                document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("selected"));
                dot.classList.add("selected");
                eraseMode = dot.dataset.color === "erase";
                currentColor = eraseMode ? null : dot.dataset.color;
            }
            selectColor(paletteBox.firstChild);

            ranks.forEach((r1, i) => {
                ranks.forEach((r2, j) => {
                    const hand = i === j ? r1 + r2 : (i < j ? r1 + r2 + "s" : r2 + r1 + "o");
                    const c = document.createElement("div");
                    c.className = "cell";
                    c.dataset.hand = hand;
                    c.textContent = hand;
                    matrixBox.appendChild(c);
                });
            });

            // Обновленная функция отрисовки (принимает флаг forceErase)
            function paint(el, forceErase = false) {
                if (!el || !el.classList.contains("cell")) return;
                
                // Если выбран ластик ИЛИ зажата правая кнопка мыши (forceErase)
                if (eraseMode || forceErase) {
                    el.style.background = "";
                    el.style.color = "";
                    el.removeAttribute("data-color");
                } else {
                    el.style.background = currentColor;
                    const hex = currentColor.replace('#','');
                    const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                    const brightness = (r*299 + g*587 + b*114) / 1000;
                    el.style.color = brightness > 160 ? "#11111b" : "#fff";
                    el.dataset.color = currentColor;
                }
            }

            // Отключаем нативное меню на правую кнопку мыши по таблице
            matrixBox.oncontextmenu = (e) => e.preventDefault();

            // Рисование и стирание с помощью мыши (e.buttons: 1 = левая, 2 = правая)
            matrixBox.onmousedown = (e) => {
                if (e.button === 0) paint(e.target, false); // Левый клик (рисовать)
                if (e.button === 2) paint(e.target, true);  // Правый клик (стирать)
            };
            matrixBox.onmouseover = (e) => {
                if (e.buttons === 1) paint(e.target, false); // Зажата левая
                if (e.buttons === 2) paint(e.target, true);  // Зажата правая
            };

            // Мобильное рисование
            matrixBox.ontouchstart = (e) => {
                e.preventDefault(); // Запрещаем скролл страницы по матрице
                const touch = e.touches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                paint(el, false);
            };
            matrixBox.ontouchmove = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                paint(el, false);
            };

            /* === Мобильная навигация (Мини-карта) === */
            const minimap = document.getElementById('minimap');
            const mapViewport = document.getElementById('minimap-viewport');
            const scrollArea = document.querySelector('.matrix-scroll-area');

            function syncMinimap() {
                const mapWidth = minimap.clientWidth - 4; // минус бордеры
                const scrollWidth = scrollArea.scrollWidth;
                const clientWidth = scrollArea.clientWidth;

                // Размер ползунка
                const viewportWidth = Math.max(20, (clientWidth / scrollWidth) * mapWidth);
                mapViewport.style.width = `${viewportWidth}px`;

                // Позиция ползунка
                const maxScrollLeft = scrollWidth - clientWidth;
                if (maxScrollLeft > 0) {
                    const scrollLeft = scrollArea.scrollLeft;
                    const leftPos = (scrollLeft / maxScrollLeft) * (mapWidth - viewportWidth);
                    mapViewport.style.left = `${leftPos + 2}px`;
                }
            }
            
            scrollArea.addEventListener('scroll', syncMinimap);
            window.addEventListener('resize', syncMinimap);
            setTimeout(syncMinimap, 100);

            // Перетаскивание ползунка на телефоне
            let mapDragging = false;
            let startMapX = 0;
            let startScroll = 0;

            minimap.addEventListener('touchstart', (e) => {
                mapDragging = true;
                startMapX = e.touches[0].clientX;
                startScroll = scrollArea.scrollLeft;
                e.preventDefault();
            }, {passive: false});

            window.addEventListener('touchmove', (e) => {
                if (!mapDragging) return;
                const dx = e.touches[0].clientX - startMapX;
                
                const mapWidth = minimap.clientWidth - 4;
                const scrollWidth = scrollArea.scrollWidth;
                const clientWidth = scrollArea.clientWidth;
                
                const viewportWidth = (clientWidth / scrollWidth) * mapWidth;
                const maxScrollLeft = scrollWidth - clientWidth;
                const maxMapMove = mapWidth - viewportWidth;

                // Соотношение пикселей карты к пикселям скролла
                const ratio = maxScrollLeft / maxMapMove;
                scrollArea.scrollLeft = startScroll + (dx * ratio);
            }, {passive: false});

            window.addEventListener('touchend', () => mapDragging = false);


            /* === Кнопки управления === */
            document.getElementById("clearAll").onclick = () => {
                if(confirm("Очистить таблицу?")) {
                    document.querySelectorAll(".cell").forEach(c => {
                        c.style.background = ""; c.style.color = ""; c.removeAttribute("data-color");
                    });
                }
            };

            document.getElementById("saveBtn").onclick = () => {
                let name = prompt("Имя файла JSON:", "poker-chart") || "poker-chart";
                const out = {};
                document.querySelectorAll(".cell").forEach(c => {
                    if (c.dataset.color) out[c.dataset.hand] = c.dataset.color;
                });
                const blob = new Blob([JSON.stringify(out)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name + ".json";
                a.click();
            };

            document.getElementById("loadBtn").onclick = () => document.getElementById("fileIn").click();
            document.getElementById("fileIn").onchange = (e) => {
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = JSON.parse(r.result);
                        document.querySelectorAll(".cell").forEach(c => {
                            const col = data[c.dataset.hand];
                            if (col) {
                                c.style.background = col;
                                c.dataset.color = col;
                                const hex = col.replace('#','');
                                const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                                const brightness = (r*299 + g*587 + b*114) / 1000;
                                c.style.color = brightness > 160 ? "#11111b" : "#fff";
                            }
                        });
                    } catch(e) { alert("Ошибка загрузки файла"); }
                };
                r.readAsText(e.target.files[0]);
            };

            /* Идеальное сохранение PNG */
            document.getElementById("savePng").onclick = async () => {
                let name = prompt("Имя файла PNG:", "poker-strategy") || "poker-strategy";
                const btn = document.getElementById("savePng");
                btn.textContent = "Создание...";
                await new Promise(r => setTimeout(r, 100));

                // Создаем обертку для идеального рендера теней и скруглений
                const wrapper = document.createElement("div");
                wrapper.style.padding = "40px";
                wrapper.style.background = "var(--surface0)"; // Фон как у body
                wrapper.style.display = "inline-flex";
                wrapper.style.justifyContent = "center";
                wrapper.style.alignItems = "center";
                
                // Временно переносим матрицу в эту обертку
                const parent = matrixBox.parentNode;
                parent.insertBefore(wrapper, matrixBox);
                wrapper.appendChild(matrixBox);

                try {
                    const canvas = await html2canvas(wrapper, {
                        scale: 2, // Высокое качество
                        backgroundColor: "#1e1e2e",
                        logging: false
                    });
                    const a = document.createElement("a");
                    a.download = name + ".png";
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                } catch (e) {
                    alert("Ошибка экспорта");
                } finally {
                    // Возвращаем все как было
                    parent.insertBefore(matrixBox, wrapper);
                    wrapper.remove();
                    btn.textContent = "Скачать PNG";
                }
            };
        </script>
    </body>
</html>
